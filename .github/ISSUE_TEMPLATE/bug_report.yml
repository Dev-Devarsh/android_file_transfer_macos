name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much detail as you can — it makes this much faster to reproduce and fix.

  - type: dropdown
    id: transport
    attributes:
      label: Transport
      description: Which connection method were you using?
      options:
        - USB (MTP)
        - Wi-Fi (FTP)
        - Not transport-related
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Tell us what you saw
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect phone via ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: e.g. macOS 14.5 (Sonoma)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Found in the app's About screen, or the git commit/tag you built from
      placeholder: e.g. v1.0.0
    validations:
      required: true

  - type: input
    id: android-device
    attributes:
      label: Android device & OS version (if relevant)
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      description: Run from a terminal with `flutter run -d macos` to capture logs, and paste anything relevant here.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, or other context.
    validations:
      required: false
